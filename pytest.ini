[pytest]
# Ensures `ml` and `backend` packages import from the repository root no matter
# which directory pytest is invoked from (pytest >= 7.0).
pythonpath = .
testpaths = backend/tests ml/tests
filterwarnings =
    ignore:.*Support for class-based `config` is deprecated.*:DeprecationWarning
    ignore:.*Uses deprecated `HTTP_422_UNPROCESSABLE_ENTITY`.*:DeprecationWarning
    ignore:.*The set_under function will be deprecated.*:DeprecationWarning
    ignore:.*The `probability` parameter was deprecated.*:FutureWarning